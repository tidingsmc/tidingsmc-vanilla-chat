name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: build
        run: ./gradlew build -Pmod_version="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v5
        with:
          name: tidings-vanilla-chat-forge
          path: build/libs/*.jar
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
